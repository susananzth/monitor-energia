spring.application.name=monitor-energia
server.port=${SERVER_PORT:8080}

# Base de datos (PostgreSQL). Se sobreescribe con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monitor_energia}
spring.datasource.username=${DB_USER:monitor}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# JSON en snake_case (i_rms, p_est, ...) y fechas ISO-8601
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=true

# CORS: orígenes permitidos separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Swagger UI en /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Autenticación: primer administrador (solo si no hay usuarios) y duración del token
app.admin.usuario=${ADMIN_USUARIO:}
app.admin.password=${ADMIN_PASSWORD:}
app.auth.duracion-token-horas=${AUTH_DURACION_TOKEN_HORAS:12}
