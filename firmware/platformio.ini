; Monitor de consumo eléctrico no invasivo — firmware ESP32
; Entornos:
;   esp32dev : placa real
;   wokwi    : simulación (Wi-Fi Wokwi-GUEST, -DSIMULACION)
;   wokwi-software : plan B de simulación (muestras generadas por software)
;   native   : pruebas unitarias en el PC (pio test -e native)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -Wall

[env:wokwi]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSIMULACION

[env:wokwi-software]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DSIMULACION
    -DSIM_SOFTWARE

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
